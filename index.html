<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ocarina of Time Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe8;--sf:#fff;--tx:#241a14;--mu:#7a6a5e;--ac:#c0392b;--bd:#ddd2c6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140d09;--sf:#241812;--tx:#f3e9dd;--mu:#a8978a;--ac:#ff5a3c;--bd:#4a362a;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
body.ovmode{background:transparent}
#app{max-width:1100px;margin:auto;padding:14px;display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:860px){#app{grid-template-columns:340px 1fr}}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px}
h2{font:800 14px Cinzel,Georgia,serif;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px;color:var(--ac)}
button,select,input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
button{cursor:pointer;font-weight:600}button:active{transform:scale(.97)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.row>*{flex:1 1 auto}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.list{max-height:340px;overflow:auto;display:grid;gap:4px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--bd);border-radius:8px}
.it small{color:var(--mu)}.it button{padding:4px 8px;flex:none}
.stat{font-size:22px;font-weight:800}.mu{color:var(--mu);font-size:13px}
#pv{width:100%;max-width:360px;margin:auto;background:#000;border:1px solid var(--bd);border-radius:8px;overflow:hidden}

 <text x="837" y="783" text-anchor="middle" font-weight="400" font-size="46" fill="#fff" style="text-shadow:none">lets get to ${s.folMax} followers!<tspan dx="26">${s.fol}/${s.folMax}</tspan></text>
 <text x="836" y="837" text-anchor="middle" font-weight="400" font-size="46" fill="#fff" stroke="#000" stroke-width="7" paint-order="stroke" style="text-shadow:none">${Math.floor(f*100)}%</text></svg>`}
function overlayHTML(s,now){
 const cur=C[s.cur],nx=C[s.nxt],need=Math.max(0,cur.cost-s.pool),act=s.active.filter(a=>!a.end||a.end>now);
 const as=act.length?act.map(a=>fx(a.n)+(a.end?' ('+mmss(Math.ceil((a.end-now)/1000))+')':'')).join(' / '):'none';
 const pop=s.pop&&now-s.pop.t<5000?`<div class="pop" data-t="${s.pop.t}">CURSED!<br>${fx(s.pop.n)}</div>`:'';
 const p=x=>Math.min(100,x*100),d=`animation-delay:-${(now%1800)/1000}s`;
 const T=(cls,l,y,w,h,fs,mn,txt)=>`<div class="t ${cls}" style="left:${l}cqw;top:${y}cqw;width:${w}cqw;height:${h}cqw"><span class="fit" data-fs="${fs}" data-min="${mn}">${txt}</span></div>`;
 return `<div class="ban"></div><div class="tc" style="left:7.5cqw;top:8.4cqw">${torch(d)}</div><div class="tc" style="left:87.2cqw;top:8.4cqw">${torch(d)}</div>
 ${T('c nw',16,9.8,68,5.4,5.4,3.4,'Final Curse: Game Reset')}${T('c nw',16,15.4,68,3.6,3.4,2.6,s.coins+'/'+s.max+' gift coins / <span style="color:#ffd24a">Game resets: '+(s.resets||0)+'</span>')}
 <div class="bar" style="top:19.8cqw"><i style="width:${p(s.coins/s.max)}%;background:linear-gradient(#e0452a,#a52412)"></i></div>
 <div class="cam" style="top:24.5cqw"></div>
 ${T('l',6,74.7,88,6,3.6,2.6,'Current goal: '+fx(cur.name)+' ('+need+' more coins)')}
 <div class="bar g" style="top:81.1cqw"><i style="width:${p(s.pool/cur.cost)}%;background:linear-gradient(#4fd464,#269a39)"></i></div>
 ${T('l nw',6,84.2,88,3.4,3.4,2.5,'Next: '+fx(nx.name)+' ('+nx.cost+' coins)')}
 ${T('l red',6,87.7,88,5.6,3.4,2.5,'Active curses: '+as)}
 <div class="cam" style="top:94.3cqw"></div>
 ${T('c nw',5,144.8,90,9.6,4.8,3.4,'Send gifts to make my game harder<br>Full gift goals on pinned post')}
 <div class="fs">${folSVG(s)}</div>${pop}`}
function fitAll(e){e.querySelectorAll('.fit').forEach(el=>{const b=el.parentNode,mn=+el.dataset.min;let fs=+el.dataset.fs;el.style.fontSize=fs+'cqw';
 for(let k=0;k<40&&fs>mn&&(el.scrollWidth>b.clientWidth+1||el.offsetHeight>b.clientHeight+1);k++){fs=Math.max(mn,fs*.94);el.style.fontSize=fs+'cqw'}})}
function paintOv(){const n=Date.now();document.querySelectorAll('.ovbox').forEach(e=>{const keep=e.querySelector('.pop');e.innerHTML=overlayHTML(S,n);fitAll(e);
 const np=e.querySelector('.pop');if(keep&&np&&keep.dataset.t===np.dataset.t){np.style.animation='none';np.style.opacity=Math.max(0,1-Math.max(0,(n-S.pop.t-4250)/750))}})}
function save(){S.v=Date.now();render();try{localStorage.setItem('ocov',JSON.stringify(S))}catch(e){}
 try{bc&&bc.postMessage(S)}catch(e){}if(ref&&canWrite)ref.set(JSON.parse(JSON.stringify(S))).catch(()=>{canWrite=false;render()})}
function adopt(d){if(d&&(isOv||d.v>=S.v)){S=Object.assign({},DEF,d);render()}}
function opts(sel){return C.map((c,i)=>`<option value="${i}" ${i===sel?'selected':''}>${c.cost} – ${c.name}</option>`).join('')}
function render(){const root=$('#app');
 if(isOv){document.body.classList.add('ovmode');if(!$('#ov')){root.style.cssText='padding:0;max-width:none;display:block';root.innerHTML='<div id="ov" class="ovbox"></div>'}paintOv();return}
 if(!$('#ctl')){root.innerHTML=`<div id="ctl" style="display:grid;gap:14px;align-content:start">
 <div class="card"><h2>Gift coins</h2><div class="stat" id="st"></div><div class="mu" id="st2"></div>
 <div class="row" id="qa"></div><div class="row"><input id="cu" type="number" placeholder="Custom coins" style="min-width:0"><button class="pri" id="cb">Add</button></div>
 <div class="row"><button id="un">↩ Undo</button><button id="rs">Reset all</button></div><div class="mu" id="wr"></div></div>
 <div class="card"><h2>Goals</h2><div class="mu">Current goal</div><select id="sc" style="width:100%"></select><div class="mu" style="margin-top:6px">Next goal</div><select id="sn" style="width:100%"></select></div>
 <div class="card"><h2>Followers</h2><div class="row"><button data-f="-1">−1</button><button data-f="1">+1</button><button data-f="10">+10</button><button data-f="50">+50</button></div><div class="mu">Goal <input id="fm" type="number" style="width:90px"></div></div></div>
 <div style="display:grid;gap:14px;align-content:start">
 <div class="card"><h2>Live preview</h2><div id="pv"><div id="ov" class="ovbox"></div></div><div class="mu" style="margin-top:8px">Overlay link (put this in the stream): <b id="lk"></b><br>Controller link (keep private): <b id="lc"></b></div></div>
 <div class="card"><h2>Active curses</h2><div class="list" id="ac"></div></div>
 <div class="card"><h2>Trigger a curse manually</h2><div class="list" id="cl"></div></div></div>`;
  $('#qa').innerHTML=[1,5,10,50,100].map(n=>`<button data-c="${n}">+${n}</button>`).join('');
  $('#sc').innerHTML=opts(0);$('#sn').innerHTML=opts(0);$('#lk').textContent=location.href.split('#')[0]+'#ocarina-of-time-overlay';$('#lc').textContent=location.href.split('#')[0]+'#ocarina-of-time-controller';
  $('#ctl').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.c)addCoins(+b.dataset.c);
   if(b.dataset.f){S.fol=Math.max(0,S.fol+ +b.dataset.f);save()}};
  $('#cb').onclick=()=>{addCoins(parseInt($('#cu').value)||0);$('#cu').value=''};
  $('#un').onclick=()=>{if(hist.length){S=JSON.parse(hist.pop());save()}};
  $('#rs').onclick=()=>{if(confirm('Reset coins, goals and curses?')){hist=[];S=Object.assign(JSON.parse(JSON.stringify(DEF)),{fol:S.fol});save()}};
  $('#sc').onchange=e=>{S.cur=+e.target.value;S.pool=0;save()};$('#sn').onchange=e=>{S.nxt=+e.target.value;save()};
  $('#fm').onchange=e=>{S.folMax=Math.max(1,+e.target.value||1000);save()};
  $('#cl').innerHTML=C.map(c=>`<div class="it"><span>${c.cost} · ${c.name}<br><small>${c.kind==='t'?mmss(c.dur)+' timer':c.kind==='i'?'instant':'until cleared'}${c.rep?' · repeatable':''}</small></span><button data-t="${c.id}">Fire</button></div>`).join('');
  $('#cl').onclick=e=>{const b=e.target.closest('button');if(b){trigger(+b.dataset.t);save()}};
  $('#ac').onclick=e=>{const b=e.target.closest('button');if(b){S.active=S.active.filter(a=>a.k!==b.dataset.k);save()}}}
 $('#st').textContent=S.coins+' / '+S.max;$('#st2').textContent='Goal progress: '+S.pool+' / '+C[S.cur].cost;
 $('#sc').value=S.cur;$('#sn').value=S.nxt;if(document.activeElement!==$('#fm'))$('#fm').value=S.folMax;
 $('#wr').textContent=canWrite?'':'Live sync is read-only for this viewer; local preview only.';
 const now=Date.now(),act=S.active.filter(a=>!a.end||a.end>now);
 $('#ac').innerHTML=act.length?act.map(a=>`<div class="it"><span>${a.n}${a.end?'<br><small>'+mmss(Math.ceil((a.end-now)/1000))+' left</small>':''}</span><button data-k="${a.k}">Clear</button></div>`).join(''):'<span class="mu">None</span>';
 paintOv()}
async function init(){document.documentElement.style.setProperty('--stone',stoneURL());try{document.fonts.ready.then(paintOv)}catch(e){}isOv=true;
 try{const l=localStorage.getItem('ocov');if(l)S=Object.assign({},DEF,JSON.parse(l))}catch(e){}
 try{bc=new BroadcastChannel('ocov');bc.onmessage=e=>adopt(e.data)}catch(e){}
 addEventListener('storage',e=>{if(e.key==='ocov'&&e.newValue)adopt(JSON.parse(e.newValue))});
 render();setInterval(()=>{S.active=S.active.filter(a=>!a.end||a.end>Date.now()-60000);isOv?paintOv():render()},1000);
 try{firebase.initializeApp(firebaseConfig);ref=firebase.database().ref('state');dbOk=true;ref.on('value',s=>{const d=s.val();if(d){d.active=d.active||[];d.fired=d.fired||[];adopt(d)}})}catch(e){}}
init();
</script></body></html>
