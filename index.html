<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ocarina of Time Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe8;--sf:#fff;--tx:#241a14;--mu:#7a6a5e;--ac:#c0392b;--bd:#ddd2c6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140d09;--sf:#241812;--tx:#f3e9dd;--mu:#a8978a;--ac:#ff5a3c;--bd:#4a362a;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
body.ovmode{background:transparent}
#app{max-width:1100px;margin:auto;padding:14px;display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:860px){#app{grid-template-columns:340px 1fr}}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px}
h2{font:800 14px Cinzel,Georgia,serif;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px;color:var(--ac)}
button,select,input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
button{cursor:pointer;font-weight:600}button:active{transform:scale(.97)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.row>*{flex:1 1 auto}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.list{max-height:340px;overflow:auto;display:grid;gap:4px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--bd);border-radius:8px}
.it small{color:var(--mu)}.it button{padding:4px 8px;flex:none}
.stat{font-size:22px;font-weight:800}.mu{color:var(--mu);font-size:13px}
#pv{width:100%;max-width:360px;margin:auto;background:#000;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
