<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ocarina of Time Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe8;--sf:#fff;--tx:#241a14;--mu:#7a6a5e;--ac:#c0392b;--bd:#ddd2c6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140d09;--sf:#241812;--tx:#f3e9dd;--mu:#a8978a;--ac:#ff5a3c;--bd:#4a362a;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
body.ovmode{background:transparent}
#app{max-width:1100px;margin:auto;padding:14px;display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:860px){#app{grid-template-columns:340px 1fr}}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px}
h2{font:800 14px Cinzel,Georgia,serif;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px;color:var(--ac)}
button,select,input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
button{cursor:pointer;font-weight:600}button:active{transform:scale(.97)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.row>*{flex:1 1 auto}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.list{max-height:340px;overflow:auto;display:grid;gap:4px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--bd);border-radius:8px}
.it small{color:var(--mu)}.it button{padding:4px 8px;flex:none}
.stat{font-size:22px;font-weight:800}.mu{color:var(--mu);font-size:13px}
#pv{width:100%;max-width:360px;margin:auto;background:#000;border:1px solid var(--bd);border-radius:8px;overflow:hidden}

/* ===== overlay (designed on a 1284 x 2250 canvas; 1px = .0779cqw) ===== */
#ov{container-type:inline-size;width:100%;aspect-ratio:1284/2250;position:relative;overflow:hidden;font-family:'Hylia Serif',Cinzel,Georgia,serif;color:#fff;text-shadow:0 2px 3px #000,0 0 6px #000}
html:has(body.ovmode),body.ovmode{overflow:hidden;height:100%}
body.ovmode #ov{width:min(100vw,calc(100dvh*1284/2250));height:min(100dvh,calc(100vw*2250/1284));max-width:none;margin:0 auto}
#ov .ban{position:absolute;left:0;right:0;top:0;height:14.2%;background:linear-gradient(#5a3418aa,#2a170acc),repeating-linear-gradient(0deg,#6b4220 0 5cqw,#4a2c14 5cqw 5.4cqw);text-align:center;border-bottom:.8cqw solid #000}
#ov .t1{font-weight:400;font-size:6.4cqw;margin-top:2.6cqw;line-height:1.05}#ov .t2{font-weight:400;font-size:3.4cqw}
#ov .torch{position:absolute;top:2cqw;width:5cqw;height:7cqw;border-radius:50% 50% 40% 40%;background:radial-gradient(#fff6b0,#ff9a1f 60%,transparent 72%);filter:blur(.4cqw);animation:fl 1s infinite alternate}
@keyframes fl{to{transform:scale(1.12,.92);opacity:.85}}
#ov .bar{position:absolute;left:1cqw;right:1cqw;height:2.8cqw;border:.5cqw solid #f1e2a5;border-radius:3cqw;background:#2a0505;overflow:hidden}
#ov .bar i{display:block;height:100%;transition:width .6s}
#ov .txt{position:absolute;left:2cqw;right:0;font-weight:400;white-space:nowrap}
#ov .cl{position:absolute;left:2cqw;right:2cqw;font-size:3.2cqw;line-height:1.2;color:#ff4a5a;max-height:36cqw;overflow:hidden;display:flex;flex-wrap:wrap;gap:.4cqw 1.6cqw}
#ov .cl .h{flex:0 0 100%}#ov .cl .i+.i::before{content:'/ '}
#ov .big{position:absolute;left:0;right:0;text-align:center;font-weight:400;line-height:1.18;font-size:6.2cqw}
#ov .fol{position:absolute;left:12%;right:12%;text-align:center;font:400 3.6cqw 'Hylia Serif',Cinzel,Georgia,serif;text-shadow:none}
#ov .fbar{position:absolute;left:12%;right:12%;height:3.4cqw;background:#2a1008;border:.4cqw solid #f1e2a5;border-radius:1cqw;overflow:hidden}
#ov .fbar i{display:block;height:100%;background:repeating-linear-gradient(135deg,#ff5a22 0 1.2cqw,#ff7a3c 1.2cqw 2.4cqw);text-align:center;color:#2a0a00;font:400 2.6cqw/3.4cqw 'Hylia Serif',Cinzel,Georgia,serif;text-shadow:none}
#ov .pop{position:absolute;left:4%;right:4%;top:40%;padding:3cqw;text-align:center;background:#1a0000ee;border:.6cqw solid #ff3b3b;border-radius:2cqw;font-weight:400;font-size:6cqw;color:#ff5a5a;animation:pp 5s forwards;z-index:3}
@keyframes pp{0%{transform:scale(.4);opacity:0}8%{transform:scale(1.06);opacity:1}12%{transform:scale(1)}85%{opacity:1}100%{opacity:0;visibility:hidden}}

<div id="app"></div>
<script>
const C=[[10,'Take 1 heart of damage','i',0,1],[15,'Cooldown Curse – items locked 20s after use','t',300,1],[20,'No Z-targeting','t',300,1],[30,'No rolling or sprinting','t',300,1],[35,'Side quest (short) – chat’s choice','p',0,1],[40,'Lose 1 max heart (rest of game)','p',0,0],[50,'Overhead camera only','t',300,1],[60,'Drop all bombs and arrows','i',0,0],[70,'Side quest (long) – chat’s choice','p',0,1],[75,'Chat picks an item I can’t use','t',300,1],[90,'No shield (rest of game)','p',0,0],[100,'Backwalk only','t',300,1],[110,'No sword for this dungeon','p',0,0],[120,'Blindfold','t',180,1],[135,'Chat picks a location – go now, no warps','p',0,0],[150,'No horse','p',0,0],[150,'No sprint (rest of game)','p',0,0],[175,'Glass cannon – beat next boss, no hits','p',0,0],[200,'Boss fight – chat picks (Hall of Fallen Foes)','p',0,0],[250,'Sticks only for this dungeon','p',0,0],[500,'No sword for the rest of the game','p',0,0],[750,'3-heart challenge','p',0,0],[1500,'1-heart challenge','p',0,0],[2500,'FINAL CURSE: GAME RESET','p',0,0]].map((c,i)=>({id:i,cost:c[0],name:c[1],kind:c[2],dur:c[3],rep:!!c[4]}));
const DEF={coins:0,max:3000,pool:0,cur:0,nxt:1,fired:[],active:[],fol:0,folMax:1000,resets:0,pop:null,v:0};
let S=JSON.parse(JSON.stringify(DEF)),hist=[],ref=null,bc=null,isOv=false,canWrite=true;
const $=s=>document.querySelector(s),mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function nextIdx(i,fired){for(let k=1;k<=C.length;k++){const j=(i+k)%C.length,c=C[j];if(c.rep||!fired.includes(j))return j}return i}
function trigger(i){const c=C[i];if(!c.rep&&!S.fired.includes(i))S.fired.push(i);
 S.active.push({k:Date.now()+'-'+i,n:c.name,end:c.kind==='t'?Date.now()+c.dur*1000:c.kind==='i'?Date.now()+15000:0});
 S.pop={n:c.name,t:Date.now()}}
function addCoins(n){if(!n)return;hist.push(JSON.stringify(S));hist=hist.slice(-30);
 S.coins=Math.max(0,S.coins+n);S.pool=Math.max(0,S.pool+n);let g=0;
 while(S.pool>=C[S.cur].cost&&g++<25){S.pool-=C[S.cur].cost;trigger(S.cur);S.cur=S.nxt;S.nxt=nextIdx(S.cur,S.fired)}
 if(S.coins>=S.max&&!S.fired.includes(23)){S.fired.push(23);trigger(23)}save()}
const fx=t=>String(t).replace(/–/g,'-');
function overlayHTML(s,now){
 const cur=C[s.cur],nx=C[s.nxt],need=Math.max(0,cur.cost-s.pool),act=s.active.filter(a=>!a.end||a.end>now);
 const L=act.map(a=>fx(a.n)),acl='<div class="h">Active curses:'+(L.length?'':' none')+'</div>'+L.slice(0,12).map(x=>'<div class="i">'+x+'</div>').join('')+(L.length>12?'<div class="i">+'+(L.length-12)+' more</div>':'');
 const pop='';
 const p=x=>Math.min(100,x*100);
 return `<div class="ban"><div class="torch" style="left:7%"></div><div class="torch" style="right:7%"></div>
 <div class="t1">Final Curse: Game Reset</div><div class="t2">${s.coins}/${s.max} gift coins / <span style="color:#ffd24a">Game resets: ${s.resets||0}</span></div>
 <div class="bar" style="top:68%"><i style="width:${p(s.coins/s.max)}%;background:#c0301a"></i></div></div>
 <div class="txt" style="top:40.2%;font-size:3.3cqw">Current goal: ${fx(cur.name)} (${need} more coins)</div>
 <div class="bar" style="top:43.3%;border-color:#e8d89a;background:#07140a"><i style="width:${p(s.pool/cur.cost)}%;background:#35c44a"></i></div>
 <div class="txt" style="top:45.8%;font-size:3.2cqw">Next: ${fx(nx.name)} (${nx.cost} coins)</div>
 <div class="cl" style="top:48%">${acl}</div>
 <div class="big" style="top:82.6%">Send gifts to make my game harder<br>Full gift goals on pinned post</div>
 <div class="fol" style="top:92%">lets get to ${s.folMax} followers! ${s.fol}/${s.folMax}</div>
 <div class="fbar" style="top:95.4%"><i style="width:${p(s.fol/s.folMax)}%">${Math.floor(p(s.fol/s.folMax))}%</i></div>${pop}`}
function paintOv(){const n=Date.now();document.querySelectorAll('.ovbox').forEach(e=>{const keep=e.querySelector('.pop');e.innerHTML=overlayHTML(S,n);
 const np=e.querySelector('.pop');if(keep&&np&&keep.dataset.t===np.dataset.t){np.style.animation='none';np.style.opacity=Math.max(0,1-Math.max(0,(n-S.pop.t-4250)/750))}})}
function save(){S.v=Date.now();render();try{localStorage.setItem('ocov',JSON.stringify(S))}catch(e){}
 try{bc&&bc.postMessage(S)}catch(e){}if(ref&&canWrite)ref.set(JSON.parse(JSON.stringify(S))).catch(()=>{canWrite=false;render()})}
function heal(o){if(o&&o.cur===0&&o.nxt===6&&!(o.fired||[]).length)o.nxt=1;return o}
function adopt(d){if(d&&d.v>=S.v){S=Object.assign({},DEF,heal(d));render()}}
function opts(sel){return C.map((c,i)=>`<option value="${i}" ${i===sel?'selected':''}>${c.cost} – ${c.name}</option>`).join('')}
function render(){const root=$('#app');
 if(isOv){document.body.classList.add('ovmode');if(!$('#ov')){root.style.cssText='padding:0;max-width:none;display:block';root.innerHTML='<div id="ov" class="ovbox"></div>'}paintOv();return}
 if(!$('#ctl')){root.innerHTML=`<div id="ctl" style="display:grid;gap:14px;align-content:start">
 <div class="card"><h2>Gift coins</h2><div class="stat" id="st"></div><div class="mu" id="st2"></div>
 <div class="row" id="qa"></div><div class="row"><input id="cu" type="number" placeholder="Custom coins" style="min-width:0"><button class="pri" id="cb">Add</button></div>
 <div class="row"><button data-m="-1000">Lower cap −1000</button><button data-m="1000">Raise cap +1000</button></div>
 <div class="row"><button id="un">↩ Undo</button><button id="rs">Reset all</button></div><div class="mu" id="wr"></div></div>
 <div class="card"><h2>Goals</h2><div class="mu">Current goal</div><select id="sc" style="width:100%"></select><div class="mu" style="margin-top:6px">Next goal</div><select id="sn" style="width:100%"></select></div>
 <div class="card"><h2>Followers</h2><div class="row"><button data-f="-1">−1</button><button data-f="1">+1</button><button data-f="10">+10</button></div><div class="mu">Goal <input id="fm" type="number" style="width:90px"></div></div>
 <div class="card"><h2>Game resets</h2><div class="stat" id="rc"></div><div class="row"><button class="pri" data-r="1">+1 Reset</button><button data-r="-1">−1</button></div><div class="mu">Shown next to “Game Reset” at the top of the overlay. “Reset all” keeps this count.</div></div></div>
 <div style="display:grid;gap:14px;align-content:start">
 <div class="card"><h2>Live preview</h2><div id="pv"><div id="ov" class="ovbox"></div></div><div class="mu" style="margin-top:8px">Overlay link (put this in the stream): <b id="lk"></b><br>Controller link (keep private): <b id="lc"></b></div></div>
 <div class="card"><h2>Active curses</h2><div class="list" id="ac"></div></div></div>`;
  $('#qa').innerHTML=[1,5,10,50,100].map(n=>`<button data-c="${n}">+${n}</button>`).join('');
  $('#sc').innerHTML=opts(0);$('#sn').innerHTML=opts(0);$('#lk').textContent=location.href.split('#')[0]+'#ocarina-of-time-overlay';$('#lc').textContent=location.href.split('#')[0];
  $('#ctl').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.c)addCoins(+b.dataset.c);
   if(b.dataset.f){S.fol=Math.max(0,S.fol+ +b.dataset.f);save()}
   if(b.dataset.r){S.resets=Math.max(0,(S.resets||0)+ +b.dataset.r);save()}
   if(b.dataset.m){S.max=Math.max(1000,S.max+ +b.dataset.m);if(S.coins<S.max)S.fired=S.fired.filter(x=>x!==23);save()}};
  $('#cb').onclick=()=>{addCoins(parseInt($('#cu').value)||0);$('#cu').value=''};
  $('#un').onclick=()=>{if(hist.length){S=JSON.parse(hist.pop());save()}};
  $('#rs').onclick=()=>{const b=$('#rs');if(b._t){clearTimeout(b._t);b._t=0;b.textContent='Reset all';hist.push(JSON.stringify(S));hist=hist.slice(-30);S=Object.assign(JSON.parse(JSON.stringify(DEF)),{fol:S.fol,resets:S.resets||0,max:S.max});save();return}
   b.textContent='Tap again to confirm';b._t=setTimeout(()=>{b._t=0;b.textContent='Reset all'},4000)};
  $('#sc').onchange=e=>{S.cur=+e.target.value;S.nxt=nextIdx(S.cur,S.fired);S.pool=0;save()};$('#sn').onchange=e=>{S.nxt=+e.target.value;save()};
  $('#fm').onchange=e=>{S.folMax=Math.max(1,+e.target.value||1000);save()};
  $('#ac').onclick=e=>{const b=e.target.closest('button');if(b){S.active=S.active.filter(a=>a.k!==b.dataset.k);save()}}}
 $('#st').textContent=S.coins+' / '+S.max;$('#rc').textContent=S.resets||0;$('#st2').textContent='Goal progress: '+S.pool+' / '+C[S.cur].cost;
 $('#sc').value=S.cur;$('#sn').value=S.nxt;if(document.activeElement!==$('#fm'))$('#fm').value=S.folMax;
 $('#wr').textContent=canWrite?'':'Live sync is read-only for this viewer; local preview only.';
 const now=Date.now(),act=S.active.filter(a=>!a.end||a.end>now);
 $('#ac').innerHTML=act.length?act.map(a=>`<div class="it"><span>${a.n}${a.end?'<br><small>'+mmss(Math.ceil((a.end-now)/1000))+' left</small>':''}</span><button data-k="${a.k}">Clear</button></div>`).join(''):'<span class="mu">None</span>';
 paintOv()}
async function init(){isOv=location.hash==='#ocarina-of-time-overlay'||location.hash==='#overlay';addEventListener('keydown',e=>{if(e.key==='Escape'&&isOv)location.hash='#ocarina-of-time-controller'});addEventListener('hashchange',()=>location.reload());
 try{const l=localStorage.getItem('ocov');if(l)S=Object.assign({},DEF,heal(JSON.parse(l)))}catch(e){}
 try{bc=new BroadcastChannel('ocov');bc.onmessage=e=>adopt(e.data)}catch(e){}
 addEventListener('storage',e=>{if(e.key==='ocov'&&e.newValue)adopt(JSON.parse(e.newValue))});
 render();setInterval(()=>{S.active=S.active.filter(a=>!a.end||a.end>Date.now()-60000);isOv?paintOv():render()},1000);
 try{const db=await Promise.race([claude.use('db'),new Promise(r=>setTimeout(()=>r(null),10000))]);
  if(db){ref=db.doc('overlay/state');const first=await ref.get();if(first.exists)adopt(first.data());
   ref.onSnapshot(s=>{if(s.exists)adopt(s.data())},()=>{})}}catch(e){}}
init();
</script></body></html>
